<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a meeting</title>
<meta name="theme-color" content="#0b4f6c">
<meta name="description" content="Request a short meeting">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .bk{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  .bk-head{text-align:center;color:#fff;margin-bottom:18px}
  .bk-head img{width:200px;max-width:70%;background:rgba(255,255,255,.92);border-radius:16px;padding:10px 14px}
  .bk-head h1{font-size:24px;margin:14px 0 4px;text-shadow:0 1px 8px rgba(0,30,45,.35)}
  .bk-head p{margin:0;opacity:.9}
  .bk .card{padding:18px;margin-bottom:14px}
  .bk h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .dayb{flex:none;width:64px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 0;text-align:center;font-weight:600;color:var(--muted)}
  .dayb b{display:block;font-size:20px;color:var(--text)}
  .dayb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .dayb[aria-pressed="true"] b{color:var(--accent-ink)}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .slot{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-weight:600;font-size:15px}
  .slot small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
  .slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .slot[aria-pressed="true"] small{color:var(--accent-ink)}
  .tz{font-size:13px;color:var(--muted);margin:10px 2px 0}
  .hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
  .done{text-align:center;padding:30px 18px}
  .done .big{font-size:44px}
</style>
</head>
<body>
<main class="bk" id="bk">
  <div class="bk-head"><img src="icons/logo.png" alt="ARO∞ logo"><h1 id="who">Book a meeting</h1><p id="sub">Loading available times…</p></div>
  <div id="body"><div class="skel"></div><div class="skel"></div></div>
</main>
<script src="config.js"></script>
<script src="book.js"></script>
</body>
</html>
